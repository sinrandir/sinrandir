<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Realistic Earth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .info h1 {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        .info p {
            font-size: 13px;
            color: #aaa;
            margin: 3px 0;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00d4ff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .stats div {
            margin: 5px 0;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            color: #00d4ff;
            text-align: center;
            font-size: 13px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00d4ff;
            font-size: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">🌍 Loading Earth...</div>
    
    <div class="info">
        <h1>🌍 Earth 3D</h1>
        <p>✨ Realistic Planet View</p>
        <p id="location">Location: ---</p>
    </div>

    <div class="stats">
        <div>FPS: <span id="fps">60</span></div>
        <div>Lat: <span id="lat">0.00</span>°</div>
        <div>Lon: <span id="lng">0.00</span>°</div>
        <div>Rot: <span id="rotation">0°</span></div>
    </div>

    <div class="controls">
        🖱️ Drag to Rotate | 🔍 Scroll to Zoom | ⏸️ Space to Pause
    </div>

    <script>
        // Initialize Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 2.5;

        // Create Starfield
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            sizeAttenuation: true
        });

        const starsVertices = [];
        for (let i = 0; i < 2000; i++) {
            starsVertices.push(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300
            );
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsVertices), 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Create Realistic Earth Texture with actual geography
        function createRealisticEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 8192;
            canvas.height = 4096;
            const ctx = canvas.getContext('2d');

            // Deep ocean blue background
            ctx.fillStyle = '#0a3d62';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add ocean depth variation
            const oceanGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            oceanGradient.addColorStop(0, '#1a5490');
            oceanGradient.addColorStop(0.5, '#0a3d62');
            oceanGradient.addColorStop(1, '#051e2d');
            ctx.fillStyle = oceanGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Land colors - realistic
            const landColors = {
                tropical: '#2d7d3a',
                temperate: '#3a8f47',
                boreal: '#4a9957',
                desert: '#c9a961',
                mountain: '#8b7355',
                snow: '#d4e6f1'
            };

            // Draw detailed continents
            function drawContinent(x, y, w, h, rotation, landColor, details = []) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                
                // Main landmass
                ctx.fillStyle = landColor;
                ctx.beginPath();
                ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
                ctx.fill();

                // Add detail roughness
                if (details.length > 0) {
                    ctx.fillStyle = landColors.mountain;
                    details.forEach(d => {
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                ctx.restore();
            }

            // North America - with mountain ranges
            drawContinent(800, 900, 400, 550, -0.3, landColors.temperate, [
                { x: -150, y: -100, r: 80 }, // Rocky Mountains
                { x: 100, y: -200, r: 60 },  // Appalachians
            ]);

            // Central America
            drawContinent(1100, 1300, 120, 150, 0.2, landColors.tropical);

            // South America
            drawContinent(1200, 1800, 280, 450, -0.1, landColors.temperate, [
                { x: -80, y: -100, r: 70 }, // Andes
            ]);

            // Greenland
            drawContinent(1500, 600, 150, 250, 0, landColors.snow);

            // Europe
            drawContinent(2200, 900, 280, 280, 0.1, landColors.temperate, [
                { x: 80, y: -100, r: 50 }, // Alps
            ]);

            // Northern Africa - Sahara Desert
            drawContinent(2500, 1200, 350, 280, 0, landColors.desert, [
                { x: -50, y: 150, r: 40 },  // Atlas Mountains
            ]);

            // Central Africa
            drawContinent(2600, 1500, 280, 380, 0.05, landColors.tropical, [
                { x: 0, y: -100, r: 60 }, // East African Highlands
            ]);

            // Middle East
            drawContinent(2800, 1050, 200, 220, 0.15, landColors.desert, [
                { x: 50, y: -80, r: 40 }, // Zagros Mountains
            ]);

            // Central Asia
            drawContinent(3200, 800, 450, 350, 0.1, landColors.boreal, [
                { x: 100, y: -50, r: 100 }, // Himalayas
                { x: -150, y: -100, r: 80 }, // Ural Mountains
            ]);

            // Russia - vast land
            drawContinent(3100, 600, 550, 400, 0, landColors.boreal);

            // China & East Asia
            drawContinent(3700, 850, 380, 320, 0.1, landColors.temperate, [
                { x: 100, y: -80, r: 70 }, // Himalayan extension
            ]);

            // Southeast Asia
            drawContinent(3950, 1150, 200, 180, 0.2, landColors.tropical);

            // India - distinct subcontinent
            drawContinent(3300, 1250, 200, 280, 0.15, landColors.temperate, [
                { x: -50, y: -100, r: 60 }, // Western Ghats
            ]);

            // Indonesia - archipelago
            drawContinent(4100, 1350, 300, 180, 0.3, landColors.tropical);

            // Australia
            drawContinent(4300, 1700, 380, 420, 0.1, landColors.desert, [
                { x: 0, y: -150, r: 50 }, // Great Dividing Range
            ]);

            // New Zealand
            drawContinent(4650, 1900, 120, 160, 0.2, landColors.temperate);

            // Antarctica - large ice sheet
            ctx.fillStyle = landColors.snow;
            ctx.fillRect(0, 3500, canvas.width, 596);

            // Add ice caps at poles
            ctx.fillStyle = 'rgba(212, 230, 241, 0.8)';
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, 200, canvas.width / 2, 300, 0, 0, Math.PI * 2);
            ctx.fill();

            // Add detailed cloud systems
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            
            // Trade wind clouds
            for (let i = 0; i < 80; i++) {
                const x = Math.random() * canvas.width;
                const y = 1200 + Math.sin(x / 300) * 200;
                const radius = Math.random() * 100 + 60;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Polar clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() < 0.5 ? 
                    Math.random() * 400 : 
                    3200 + Math.random() * 400;
                const radius = Math.random() * 80 + 40;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Cyclone/hurricane patterns (swirling clouds)
            ctx.fillStyle = 'rgba(200, 220, 240, 0.3)';
            for (let i = 0; i < 10; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                for (let j = 0; j < 5; j++) {
                    const angle = (j / 5) * Math.PI * 2;
                    const cx = x + Math.cos(angle) * (150 + j * 40);
                    const cy = y + Math.sin(angle) * (150 + j * 40);
                    ctx.beginPath();
                    ctx.arc(cx, cy, 30 + j * 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Add some shimmer/specular highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 20 + 5, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const earthTexture = createRealisticEarthTexture();

        // Create Earth with high quality
        const earthGeometry = new THREE.SphereGeometry(1, 256, 256);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 8,
            emissive: 0x1a1a1a,
            emissiveIntensity: 0.3
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.rotation.z = -0.41; // Earth's axial tilt
        scene.add(earth);

        // Realistic Atmosphere
        const atmosphereGeometry = new THREE.SphereGeometry(1.06, 128, 128);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x87ceeb,
            transparent: true,
            opacity: 0.2,
            side: THREE.BackSide,
            emissive: 0x4da6ff,
            emissiveIntensity: 0.1
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // Realistic Clouds Layer
        function createRealisticCloudsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // High altitude clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 150 + 80;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Low altitude clouds (more opaque)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 120 + 60;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const cloudsTexture = createRealisticCloudsTexture();
        const cloudsGeometry = new THREE.SphereGeometry(1.025, 256, 256);
        const cloudsMaterial = new THREE.MeshPhongMaterial({
            map: cloudsTexture,
            transparent: true,
            opacity: 0.45,
            emissive: 0xffffff,
            emissiveIntensity: 0.1
        });
        const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
        clouds.rotation.z = -0.41;
        scene.add(clouds);

        // Advanced Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
        sunLight.position.set(6, 4, 6);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Soft ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        // Night side illumination (from moon/stars reflection)
        const nightLight = new THREE.PointLight(0x2a5f8f, 0.5);
        nightLight.position.set(-6, -4, -6);
        scene.add(nightLight);

        // Rim light for atmosphere glow
        const rimLight = new THREE.DirectionalLight(0x87ceeb, 0.8);
        rimLight.position.set(-8, 0, 0);
        scene.add(rimLight);

        // Controls
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let autoRotate = true;
        let isPaused = false;

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouse = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMouse.x;
                const deltaY = e.clientY - previousMouse.y;

                earth.rotation.y += deltaX * 0.008;
                earth.rotation.x += deltaY * 0.008;
                clouds.rotation.y = earth.rotation.y;
                clouds.rotation.x = earth.rotation.x;

                previousMouse = { x: e.clientX, y: e.clientY };
                autoRotate = false;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            setTimeout(() => {
                autoRotate = true;
            }, 500);
        });

        // Touch Controls
        let touchStart = { x: 0, y: 0 };

        document.addEventListener('touchstart', (e) => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        document.addEventListener('touchmove', (e) => {
            const deltaX = e.touches[0].clientX - touchStart.x;
            const deltaY = e.touches[0].clientY - touchStart.y;

            earth.rotation.y += deltaX * 0.008;
            earth.rotation.x += deltaY * 0.008;
            clouds.rotation.y = earth.rotation.y;
            clouds.rotation.x = earth.rotation.x;

            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        // Zoom
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.0015;
            camera.position.z = Math.max(1.2, Math.min(5, camera.position.z));
        }, { passive: false });

        // Pause/Resume
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                isPaused = !isPaused;
                autoRotate = !isPaused;
            }
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        let frameCount = 0;
        let lastTime = Date.now();

        function getLocationFromRotation() {
            const lon = (earth.rotation.y * 180 / Math.PI) % 360;
            const lat = Math.max(-90, Math.min(90, (earth.rotation.x * 180 / Math.PI)));

            document.getElementById('lat').textContent = lat.toFixed(2);
            document.getElementById('lng').textContent = lon.toFixed(2);

            let location = 'Pacific Ocean';
            
            // More detailed location detection
            if (lon > 280 || lon < -100) {
                if (lat > 15 && lat < 55) location = 'North America';
                else if (lat > -35 && lat < 15) location = 'Central America & Caribbean';
                else if (lat < -15) location = 'South America';
            } else if (lon > 260 && lon < 330) {
                if (lat > 50) location = 'Canada & Greenland';
                else if (lat < -50) location = 'Antarctica';
                else location = 'Atlantic Ocean';
            } else if (lon > 330 || lon < -30) {
                if (lat > 35) location = 'Scandinavia';
                else if (lat > -35 && lat < 35) location = 'Europe & Africa';
                else location = 'South Atlantic';
            } else if (lon > -30 && lon < 100) {
                if (lat > 40) location = 'Russia';
                else if (lat < -35) location = 'Antarctica';
                else if (lat > 0) location = 'Africa & Middle East';
                else location = 'Indian Ocean';
            } else if (lon > 100 && lon < 180) {
                if (lat > 40) location = 'Central Asia';
                else if (lat > 20) location = 'East Asia';
                else if (lat < -35) location = 'Australia';
                else location = 'Southeast Asia';
            } else if (lon > 150) {
                if (lat < -45) location = 'Antarctica';
                else if (lat < -10) location = 'Oceania';
                else location = 'Pacific Ocean';
            }

            document.getElementById('location').textContent = `Location: ${location}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && !isPaused) {
                earth.rotation.y += 0.00008; // Realistic rotation speed
                clouds.rotation.y += 0.00012; // Clouds move slightly faster
                clouds.rotation.z += 0.00002;
            }

            stars.rotation.x += 0.00001;
            stars.rotation.y += 0.00001;

            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            const rotationDegrees = (earth.rotation.y * 180 / Math.PI) % 360;
            document.getElementById('rotation').textContent = rotationDegrees.toFixed(0) + '°';

            getLocationFromRotation();

            renderer.render(scene, camera);
        }

        // Start animation
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            animate();
        }, 500);
    </script>
</body>
</html>
