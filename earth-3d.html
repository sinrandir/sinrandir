<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Realistic Earth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .info h1 {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        .info p {
            font-size: 13px;
            color: #aaa;
            margin: 3px 0;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00d4ff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .stats div {
            margin: 5px 0;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            color: #00d4ff;
            text-align: center;
            font-size: 13px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00d4ff;
            font-size: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">🌍 Loading Earth...</div>
    
    <div class="info">
        <h1>🌍 Earth 3D</h1>
        <p>✨ Realistic Planet View</p>
        <p id="location">Location: ---</p>
    </div>

    <div class="stats">
        <div>FPS: <span id="fps">60</span></div>
        <div>Lat: <span id="lat">0.00</span>°</div>
        <div>Lon: <span id="lng">0.00</span>°</div>
        <div>Rot: <span id="rotation">0°</span></div>
    </div>

    <div class="controls">
        🖱️ Drag to Rotate | 🔍 Scroll to Zoom | ⏸️ Space to Pause
    </div>

    <script>
        // Initialize Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 2.5;

        // Create Starfield
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            sizeAttenuation: true
        });

        const starsVertices = [];
        for (let i = 0; i < 2000; i++) {
            starsVertices.push(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300
            );
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsVertices), 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Create Earth Texture
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            // Ocean color
            ctx.fillStyle = '#1a5f7a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Land color
            ctx.fillStyle = '#2d8659';

            // Draw continents
            const continents = [
                { x: 400, y: 600, w: 300, h: 400 }, // North America
                { x: 600, y: 1200, w: 180, h: 300 }, // South America
                { x: 800, y: 400, w: 100, h: 180 }, // Greenland
                { x: 1500, y: 650, w: 200, h: 200 }, // Europe
                { x: 1600, y: 1100, w: 250, h: 350 }, // Africa
                { x: 1800, y: 900, w: 150, h: 180 }, // Middle East
                { x: 2200, y: 700, w: 300, h: 250 }, // Central Asia
                { x: 2100, y: 400, w: 400, h: 300 }, // Russia
                { x: 2600, y: 700, w: 300, h: 250 }, // East Asia
                { x: 2700, y: 950, w: 150, h: 150 }, // SE Asia
                { x: 2200, y: 950, w: 120, h: 150 }, // India
                { x: 2900, y: 1350, w: 200, h: 220 }, // Australia
                { x: 3150, y: 1450, w: 80, h: 100 }, // New Zealand
            ];

            continents.forEach(c => {
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.h, Math.random() * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Antarctica
            ctx.fillRect(0, 1700, canvas.width, 348);

            // Add clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let i = 0; i < 100; i++) {
                ctx.beginPath();
                ctx.arc(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 80 + 40,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const earthTexture = createEarthTexture();

        // Create Earth
        const earthGeometry = new THREE.SphereGeometry(1, 128, 128);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 5,
            emissive: 0x111111
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.rotation.z = -0.41; // Earth's axial tilt
        scene.add(earth);

        // Atmosphere
        const atmosphereGeometry = new THREE.SphereGeometry(1.05, 128, 128);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x4da6ff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // Clouds
        function createCloudsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 150; i++) {
                ctx.beginPath();
                ctx.arc(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 60 + 30,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const cloudsTexture = createCloudsTexture();
        const cloudsGeometry = new THREE.SphereGeometry(1.02, 128, 128);
        const cloudsMaterial = new THREE.MeshPhongMaterial({
            map: cloudsTexture,
            transparent: true,
            opacity: 0.4
        });
        const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
        clouds.rotation.z = -0.41;
        scene.add(clouds);

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const nightLight = new THREE.PointLight(0x1a5f7a, 0.4);
        nightLight.position.set(-5, -3, -5);
        scene.add(nightLight);

        // Controls
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let autoRotate = true;
        let isPaused = false;

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouse = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMouse.x;
                const deltaY = e.clientY - previousMouse.y;

                earth.rotation.y += deltaX * 0.008;
                earth.rotation.x += deltaY * 0.008;
                clouds.rotation.y = earth.rotation.y;
                clouds.rotation.x = earth.rotation.x;

                previousMouse = { x: e.clientX, y: e.clientY };
                autoRotate = false;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            setTimeout(() => {
                autoRotate = true;
            }, 500);
        });

        // Touch Controls
        let touchStart = { x: 0, y: 0 };

        document.addEventListener('touchstart', (e) => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        document.addEventListener('touchmove', (e) => {
            const deltaX = e.touches[0].clientX - touchStart.x;
            const deltaY = e.touches[0].clientY - touchStart.y;

            earth.rotation.y += deltaX * 0.008;
            earth.rotation.x += deltaY * 0.008;
            clouds.rotation.y = earth.rotation.y;
            clouds.rotation.x = earth.rotation.x;

            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        // Zoom
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.0015;
            camera.position.z = Math.max(1.2, Math.min(5, camera.position.z));
        }, { passive: false });

        // Pause/Resume
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                isPaused = !isPaused;
                autoRotate = !isPaused;
            }
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        let frameCount = 0;
        let lastTime = Date.now();

        function getLocationFromRotation() {
            const lon = (earth.rotation.y * 180 / Math.PI) % 360;
            const lat = Math.max(-90, Math.min(90, (earth.rotation.x * 180 / Math.PI)));

            document.getElementById('lat').textContent = lat.toFixed(2);
            document.getElementById('lng').textContent = lon.toFixed(2);

            let location = 'Pacific Ocean';
            if (lon > -180 && lon < -60 && lat > -60 && lat < 60) location = 'Americas';
            else if (lon > -30 && lon < 50 && lat > -40 && lat < 70) location = 'Europe & Africa';
            else if (lon > 50 && lon < 150 && lat > -50 && lat < 60) location = 'Asia';
            else if (lon > 110 && lon < 180 && lat > -60 && lat < -10) location = 'Australia';
            else if (lat < -60) location = 'Antarctica';

            document.getElementById('location').textContent = `Location: ${location}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && !isPaused) {
                earth.rotation.y += 0.0001; // Realistic rotation speed
                clouds.rotation.y += 0.00015;
                clouds.rotation.z += 0.00003;
            }

            stars.rotation.x += 0.00001;
            stars.rotation.y += 0.00001;

            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            const rotationDegrees = (earth.rotation.y * 180 / Math.PI) % 360;
            document.getElementById('rotation').textContent = rotationDegrees.toFixed(0) + '°';

            getLocationFromRotation();

            renderer.render(scene, camera);
        }

        // Start animation
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            animate();
        }, 300);
    </script>
</body>
</html>
